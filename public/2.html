<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Recebedor de Imagens</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background-color: #f0f0f0;
    }

    h1 {
      margin-top: 20px;
      font-size: 2rem;
      color: #333;
    }

    .client-list {
      margin-top: 20px;
      padding: 20px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      width: 90%;
      max-width: 600px;
      text-align: center;
    }

    .client-list button {
      margin: 5px;
      padding: 10px;
      background-color: #219653;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 5px;
    }

    .client-list button:hover {
      background-color: #6fcf97;
    }

    #camera-viewer {
      margin-top: 20px;
      width: 80%;
      max-width: 600px;
      height: 400px;
      background-color: #ddd;
      border: 1px solid #ccc;
      display: none;
      position: relative;
      overflow: hidden;
    }

    #camera-viewer img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

  </style>
</head>
<body>
  <h1>Visualizar Câmeras</h1>

  <!-- Painel de IPs -->
  <div class="client-list" id="client-list">
    <h2>Usuários Conectados</h2>
    <!-- A lista de IPs será preenchida dinamicamente aqui -->
  </div>

  <!-- Painel para visualização da câmera -->
  <div id="camera-viewer">
    <img id="camera-image" src="" alt="Imagem da Câmera" />
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const clientListDiv = document.getElementById('client-list');
    const cameraViewerDiv = document.getElementById('camera-viewer');
    const cameraImage = document.getElementById('camera-image');

    let currentViewerIp = null;

    // Atualizar a lista de IPs conectados
    socket.on('update-client-list', (clientIps) => {
      clientListDiv.innerHTML = '<h2>Usuários Conectados</h2>';
      clientIps.forEach(ip => {
        const button = document.createElement('button');
        button.textContent = ip;
        button.onclick = () => {
          currentViewerIp = ip;
          cameraViewerDiv.style.display = 'block';
          cameraImage.src = '';  // Limpar imagem anterior
          cameraImage.setAttribute('data-ip', ip);  // Atribui o IP para controlar quem visualizará
        };
        clientListDiv.appendChild(button);
      });
    });

    // Receber imagens de outros usuários
    socket.on('new-image', (data) => {
      if (data.ip === currentViewerIp) {
        cameraImage.src = data.imageData;  // Atualizar a imagem exibida
      }
    });
  </script>
</body>
</html>
